name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Data lock holds before rebuild
        run: python pipeline/verify_data.py
      - name: Pipeline reproduces the committed data exactly
        run: python pipeline/v1_pipeline.py && python pipeline/verify_data.py
      - run: python -m pytest -q tests
